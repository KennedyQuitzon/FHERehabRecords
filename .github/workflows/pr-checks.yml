name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for console.log
        run: |
          if grep -r "console\.log" contracts/ --include="*.sol"; then
            echo "❌ Found console.log statements in contracts"
            exit 1
          else
            echo "✅ No console.log found in contracts"
          fi

      - name: Check contract comments
        run: |
          echo "Checking for adequate contract documentation..."
          files_without_natspec=0
          for file in contracts/*.sol; do
            if ! grep -q "@title\|@notice\|@dev" "$file"; then
              echo "⚠️  Missing NatSpec in $file"
              files_without_natspec=$((files_without_natspec + 1))
            fi
          done
          if [ $files_without_natspec -gt 0 ]; then
            echo "⚠️  $files_without_natspec contract(s) missing NatSpec documentation"
          else
            echo "✅ All contracts have NatSpec documentation"
          fi

      - name: Run tests
        run: npm test

      - name: Check test coverage
        run: |
          npm run coverage
          echo "📊 Coverage report generated"

  gas-analysis:
    name: Gas Usage Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run gas reporter
        run: REPORT_GAS=true npm test

      - name: Comment gas report
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let gasReport = '';
            try {
              gasReport = fs.readFileSync('gas-report.txt', 'utf8');
            } catch (error) {
              gasReport = 'Gas report not available';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⛽ Gas Usage Report\n\n\`\`\`\n${gasReport}\n\`\`\``
            });
        continue-on-error: true
